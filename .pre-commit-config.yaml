repos:
  # =========================
  # Ruff (Lint + Format)
  # =========================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.8
    hooks:
      - id: ruff
        args: [--fix]
        exclude: |
          (?x)^(
            venv/|
            .venv/|
            migrations/|
            __pycache__/
          )
      - id: ruff-format
        exclude: |
          (?x)^(
            venv/|
            .venv/|
            migrations/|
            __pycache__/
          )

  # =========================
  # Bandit (Security scan)
  # =========================
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        args: ["-x", "venv,.venv,tests,migrations,__pycache__"]

  # =========================
  # Gitleaks (Secrets detection)
  # =========================
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.0
    hooks:
      - id: gitleaks
        args: ["--redact"]