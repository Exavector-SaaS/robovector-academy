name: CI/CD Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    types: [opened, closed]
  workflow_dispatch:

jobs:
  run-ci-pipeline:
    runs-on: ubuntu-latest
    # Force use of Node.js 24 to resolve deprecation warning
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    # PostgreSQL service container
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: robovector_db
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        # Health check to ensure the DB is ready before starting tests
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Include necessary testing tools
          pip install ruff pytest pytest-django bandit

      - name: Linting and Formatting (Ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Security Scan (Bandit)
        run: bandit -r .

      - name: Run Tests (Pytest)
        env:
          # Set database URL for Django tests
          DATABASE_URL: postgresql://user:password@localhost:5432/robovector_db
        run: pytest

      - name: Send Mattermost notification
        if: always()
        run: |
          STATUS="${{ job.status }}"
          REPO="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"
          AUTHOR="${{ github.actor }}"
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA=${COMMIT_SHA:0:7}
          EVENT_NAME="${{ github.event_name }}"
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          if [ "$EVENT_NAME" == "push" ]; then
            if [[ "${{ github.event.head_commit.message }}" == *"Merge pull request"* ]]; then
              echo "Merge detected, skipping push notification."
              exit 0
            fi
            EVENT_TYPE="🚀 Developer Push"
            MSG="${{ github.event.head_commit.message }}"

          elif [ "$EVENT_NAME" == "pull_request" ]; then
            if [ "${{ github.event.action }}" == "opened" ]; then
              EVENT_TYPE="📂 PR Opened"
              MSG="${{ github.event.pull_request.title }}"
            elif [ "${{ github.event.action }}" == "closed" ] && [ "${{ github.event.pull_request.merged }}" == "true" ]; then
              EVENT_TYPE="✅ PR Merged"
              MSG="${{ github.event.pull_request.title }}"
            else
              echo "Ignoring PR action: ${{ github.event.action }}"
              exit 0
            fi
          else
            EVENT_TYPE="ℹ️ Other ($EVENT_NAME)"
            MSG="Event not explicitly tracked"
          fi

          if [ "$STATUS" = "success" ]; then
            EMOJI="✅"
            COLOR="#00FF00"
          else
            EMOJI="❌"
            COLOR="#FF0000"
          fi

          TEXT="**RoboVector CI Notification**\n\n${EMOJI} **Status**: ${STATUS}\n**Event**: ${EVENT_TYPE}\n- **Repo**: ${REPO}\n- **Branch**: ${BRANCH}\n- **Author**: ${AUTHOR}\n- **Commit**: \`${SHORT_SHA}\`\n- **Message**: ${MSG}\n- **Link**: [View Run](${RUN_URL})"

          curl -X POST -H "Content-Type: application/json" \
          -d "{\"attachments\": [{\"color\": \"$COLOR\", \"text\": \"$TEXT\"}]}" \
          ${{ secrets.MATTERMOST_WEBHOOK_URL }}
      - name: Send email notification
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "CI Pipeline Status: ${{ job.status }}"
          body: "The CI pipeline for ${{ github.repository }} has finished with status: ${{ job.status }}. View details at: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          to: exavector.saas@gmail.com
          from: GitHub Actions