name: CI Mattermost Notification

on:
  push:
    branches:
      - '**'
  pull_request:
    types: [opened, closed]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Mattermost notification
        if: always()
        run: |
          # Debug: Log the event details
          echo "DEBUG: Workflow triggered by event: ${{ github.event_name }}"
          echo "DEBUG: Branch: ${{ github.ref_name }}"
          
          # 1. Setup basic variables
          STATUS="${{ job.status }}"
          REPO="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"
          AUTHOR="${{ github.actor }}"
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA=${COMMIT_SHA:0:7}
          EVENT_NAME="${{ github.event_name }}"
          
          # 2. Logic to determine message type
          if [ "$EVENT_NAME" == "push" ]; then
            # Filter out Merge commits to avoid duplicates
            if [[ "${{ github.event.head_commit.message }}" == *"Merge pull request"* ]]; then
              echo "Merge detected, skipping push notification."
              exit 0
            fi
            EVENT_TYPE="🚀 Developer Push"
            MSG="${{ github.event.head_commit.message }}"
            
          elif [ "$EVENT_NAME" == "pull_request" ]; then
            if [ "${{ github.event.action }}" == "opened" ]; then
              EVENT_TYPE="📂 PR Opened"
              MSG="${{ github.event.pull_request.title }}"
            elif [ "${{ github.event.action }}" == "closed" ] && [ "${{ github.event.pull_request.merged }}" == "true" ]; then
              EVENT_TYPE="✅ PR Merged"
              MSG="${{ github.event.pull_request.title }}"
            else
              echo "Ignoring PR action: ${{ github.event.action }}"
              exit 0
            fi
          else
            EVENT_TYPE="ℹ️ Other ($EVENT_NAME)"
            MSG="Event not explicitly tracked"
          fi

          # 3. Setup colors and emojis
          if [ "$STATUS" = "success" ]; then
            EMOJI="✅"
            COLOR="#00FF00"
          else
            EMOJI="❌"
            COLOR="#FF0000"
          fi

          # 4. Construct message payload
          TEXT="**ExaZone CI Notification**\n\n${EMOJI} **Status**: ${STATUS}\n**Event**: ${EVENT_TYPE}\n- **Repo**: ${REPO}\n- **Branch**: ${BRANCH}\n- **Author**: ${AUTHOR}\n- **Commit**: \`${SHORT_SHA}\`\n- **Message**: ${MSG}"

          # 5. Send payload to Mattermost
          curl -X POST -H "Content-Type: application/json" \
          -d "{\"attachments\": [{\"color\": \"$COLOR\", \"text\": \"$TEXT\"}]}" \
          ${{ secrets.MATTERMOST_WEBHOOK_URL }}