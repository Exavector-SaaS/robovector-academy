name: CI Mattermost Notification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Mattermost notification
        if: always()
        run: |
          # 1. Setup basic variables
          STATUS="${{ job.status }}"
          REPO="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"
          AUTHOR="${{ github.actor }}"
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA=${COMMIT_SHA:0:7}
          
          # 2. Determine event type and message
          if [ "${{ github.event_name }}" == "push" ]; then
            EVENT_TYPE="🚀 Direct Push"
            MSG="${{ github.event.head_commit.message }}"
          elif [ "${{ github.event_name }}" == "pull_request" ]; then
            if [ "${{ github.event.action }}" == "closed" ] && [ "${{ github.event.pull_request.merged }}" == "true" ]; then
              EVENT_TYPE="✅ PR Merged"
            else
              EVENT_TYPE="📂 PR ${{ github.event.action }}"
            fi
            MSG="${{ github.event.pull_request.title }}"
          else
            EVENT_TYPE="ℹ️ Other (${{ github.event_name }})"
            MSG="No specific message"
          fi

          # 3. Setup colors and emojis
          if [ "$STATUS" = "success" ]; then
            EMOJI="✅"
            COLOR="#00FF00"
          else
            EMOJI="❌"
            COLOR="#FF0000"
          fi

          # 4. Construct message payload
          TEXT="**ExaZone CI Notification**\n\n${EMOJI} **Status**: ${STATUS}\n**Event**: ${EVENT_TYPE}\n- **Repo**: ${REPO}\n- **Branch**: ${BRANCH}\n- **Author**: ${AUTHOR}\n- **Commit**: \`${SHORT_SHA}\`\n- **Message**: ${MSG}"

          # 5. Send payload to Mattermost
          curl -X POST -H "Content-Type: application/json" \
          -d "{\"attachments\": [{\"color\": \"$COLOR\", \"text\": \"$TEXT\"}]}" \
          ${{ secrets.MATTERMOST_WEBHOOK_URL }}